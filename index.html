<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>تقویم آتیله | ATILIE CALENDAR</title>
<meta name="theme-color" content="#4D52B4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="تقویم آتیله" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234D52B4'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='%23fff' font-family='sans-serif'>آ</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --purple:#4D52B4;--purple-d:#3C419B;--purple-l:#EDEEF9;
  --blue:#4E9CE8;--blue-l:#E8F2FC;
  --teal:#70D6C5;--teal-l:#E4F8F5;
  --green:#CAE5BC;--cream:#E1EDD4;
  --bg:#F5F7FB;--card:#fff;--text:#1D2140;--muted:#7C82A0;
  --border:#E6E9F2;--danger:#E2547A;--danger-l:#FDEDF1;--ok:#5BAE7C;--warn:#E8A33D;
  --r:16px;--shadow:0 4px 20px rgba(77,82,180,.08);
}
html,body{margin:0;padding:0}
body{font-family:Vazirmatn,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit;font-size:14px}
h1,h2,h3,h4,p{margin:0}
a{color:var(--purple)}
.app{display:flex;min-height:100vh}
.sidebar{width:236px;background:#fff;border-left:1px solid var(--border);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;display:none;flex-shrink:0}
.main{flex:1;min-width:0;padding-bottom:86px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.brand-logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--purple),var(--blue));display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;flex-shrink:0;box-shadow:0 6px 16px rgba(77,82,180,.32)}
.brand-txt b{display:block;font-size:14px;line-height:1.4}
.brand-txt span{font-size:9px;letter-spacing:1.6px;color:var(--muted);font-weight:600}
.navlist{display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:none;border:0;cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:500;text-align:right;width:100%;transition:.18s}
.navitem:hover{background:var(--bg);color:var(--text)}
.navitem.active{background:var(--purple-l);color:var(--purple);font-weight:600}
.navitem .ic{font-size:16px;width:20px;text-align:center}
.bottomnav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 20px rgba(77,82,180,.06)}
.bottomnav button{flex:1;background:none;border:0;padding:9px 2px 8px;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-weight:500}
.bottomnav button .ic{font-size:18px;line-height:1}
.bottomnav button.active{color:var(--purple)}
.bottomnav button.fab{flex:0 0 62px;justify-content:center}
.bottomnav button.fab .ic{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;display:grid;place-items:center;font-size:24px;margin-top:-22px;box-shadow:0 8px 20px rgba(77,82,180,.4)}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40}
.topbar h1{font-size:16px;font-weight:700}
.topbar .sub{font-size:11px;color:var(--muted);font-weight:400}
.content{padding:16px;max-width:1150px;margin:0 auto}
@media(min-width:900px){
  .sidebar{display:block}
  .main{padding-bottom:24px}
  .bottomnav{display:none}
  .content{padding:22px}
}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid rgba(230,233,242,.7);margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-size:14px;font-weight:700}
.card-h .link{font-size:12px;color:var(--purple);cursor:pointer;font-weight:500;background:none;border:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:640px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border-radius:14px;padding:13px;box-shadow:var(--shadow);border:1px solid rgba(230,233,242,.7);position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3.5px;border-radius:0 4px 4px 0}
.stat.p::after{background:var(--purple)}.stat.b::after{background:var(--blue)}
.stat.t::after{background:var(--teal)}.stat.g::after{background:var(--ok)}
.stat.w::after{background:var(--warn)}.stat.d::after{background:var(--danger)}
.stat .lbl{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:4px;display:block}
.stat .val{font-size:21px;font-weight:700;letter-spacing:-.5px;line-height:1.3}
.stat .unit{font-size:10.5px;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--text);font-weight:600;font-size:13px;cursor:pointer;transition:.16s;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 6px 16px rgba(77,82,180,.28)}
.btn-primary:hover{background:var(--purple-d)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn-danger{background:var(--danger-l);border-color:#F6CEDA;color:var(--danger)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--purple)}
.btn-block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.field{margin-bottom:12px;flex:1;min-width:0}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:11px;background:#fff;color:var(--text);outline:none;transition:.16s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-l)}
.field textarea{resize:vertical;min-height:64px}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.frow .field{min-width:140px}
.section-title{font-size:12.5px;font-weight:700;color:var(--purple);margin:20px 0 10px;display:flex;align-items:center;gap:7px;padding-bottom:7px;border-bottom:1.5px dashed var(--border)}
.section-title:first-child{margin-top:0}
.date-wrap{position:relative;display:flex;gap:6px}
.date-wrap input{flex:1}
.date-btn{width:42px;flex:0 0 42px;border:1.5px solid var(--border);background:#fff;border-radius:11px;cursor:pointer;font-size:16px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 13px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);transition:.16s;display:inline-flex;align-items:center;gap:5px}
.chip.active{background:var(--purple);border-color:var(--purple);color:#fff}
.chip .dot{width:7px;height:7px;border-radius:50%}
</style>
</head>
