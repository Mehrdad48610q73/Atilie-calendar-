<script>
  /* ==================== JALALI CORE ==================== */
function _div(a,b){return ~~(a/b)}
function _mod(a,b){return a-~~(a/b)*b}
function jalCal(jy,withoutLeap){
  var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var bl=breaks.length,gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump,leap,leapG,march,n,i;
  if(jy<jp||jy>=breaks[bl-1]) throw new Error('سال شمسی نامعتبر: '+jy);
  for(i=1;i<bl;i+=1){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+_div(jump,33)*8+_div(_mod(jump,33),4);jp=jm}
  n=jy-jp;
  leapJ=leapJ+_div(n,33)*8+_div(_mod(n,33)+3,4);
  if(_mod(jump,33)===4&&jump-n===4) leapJ+=1;
  leapG=_div(gy,4)-_div((_div(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(!withoutLeap){
    if(jump-n<6) n=n-jump+_div(jump+4,33)*33;
    leap=_mod(_mod(n+1,33)-1,4);
    if(leap===-1) leap=4;
  }
  return {leap:leap,gy:gy,march:march};
}
function g2d(gy,gm,gd){
  var d=_div((gy+_div(gm-8,6)+100100)*1461,4)+_div(153*_mod(gm+9,12)+2,5)+gd-34840408;
  d=d-_div(_div(gy+100100+_div(gm-8,6),100)*3,4)+752;
  return d;
}
function d2g(jdn){
  var j=_div(4*jdn+139361631,1);
  j=j+_div(_div(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=_div(_mod(j,1461),4)*5+308;
  var gd=_div(_mod(i,153),5)+1;
  var gm=_mod(_div(i,153),12)+1;
  var gy=_div(j,1461)-100100+_div(8-gm,6);
  return {gy:gy,gm:gm,gd:gd};
}
function j2d(jy,jm,jd){
  var r=jalCal(jy,true);
  return g2d(r.gy,3,r.march)+(jm-1)*31-_div(jm,7)*(jm-7)+jd-1;
}
function d2j(jdn){
  var gy=d2g(jdn).gy,jy=gy-621,r=jalCal(jy,false),jdn1f=g2d(gy,3,r.march),jd,jm,k;
  k=jdn-jdn1f;
  if(k>=0){
    if(k<=185){jm=1+_div(k,31);jd=_mod(k,31)+1;return{jy:jy,jm:jm,jd:jd}}
    else k-=186;
  } else {jy-=1;k+=179;if(r.leap===1)k+=1}
  jm=7+_div(k,30);jd=_mod(k,30)+1;
  return {jy:jy,jm:jm,jd:jd};
}
function isLeapJalaali(jy){return jalCal(jy,false).leap===0}
function jMonthLen(jy,jm){
  if(jm<=6)return 31;
  if(jm<=11)return 30;
  return isLeapJalaali(jy)?30:29;
}
function jWeekday(jy,jm,jd){
  var g=d2g(j2d(jy,jm,jd));
  var dt=new Date(g.gy,g.gm-1,g.gd);
  return (dt.getDay()+1)%7;
}

/* ==================== CONSTANTS ==================== */
var MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
var WDS=['ش','ی','د','س','چ','پ','ج'];
var FA='۰۱۲۳۴۵۶۷۸۹';
var STAGES=['رزرو ثبت شده','در انتظار اجرای مراسم','مراسم انجام شده','در حال انتخاب عکس','در حال تدوین فیلم','در حال آماده‌سازی آلبوم','آماده تحویل','تحویل نهایی شده'];
var PAY_METHODS=['کارت به کارت','نقدی','انتقال بانکی','سایر'];
var OUT_TYPES=['فیلم','عکس','آلبوم','کلیپ','سایر'];
var OUT_STATUS=['در انتظار','در حال انجام','آماده','تحویل شده'];
var KIND={
  ceremony:{label:'مراسم',color:'#4D52B4'},
  photo:{label:'عکاسی',color:'#2B9B8A'},
  video:{label:'فیلم‌برداری',color:'#4E9CE8'},
  formal:{label:'فرمالیته',color:'#8B7BD8'},
  delivery:{label:'تحویل',color:'#6FA85A'}
};

/* ==================== UTILS ==================== */
function fa(n){return String(n).replace(/[0-9]/g,function(d){return FA[+d]})}
function enDigits(s){return String(s==null?'':s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})}
function money(n){n=Math.round(Number(n)||0);return fa(n.toLocaleString('en-US'))}
function pad2(n){return (n<10?'0':'')+n}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function todayJ(){var d=new Date();var g={gy:d.getFullYear(),gm:d.getMonth()+1,gd:d.getDate()};return d2j(g2d(g.gy,g.gm,g.gd))}
function dkey(d){return d?(d.jy+'-'+pad2(d.jm)+'-'+pad2(d.jd)):''}
function dnum(d){return d?j2d(d.jy,d.jm,d.jd):0}
function fmtJ(d,withWd){
  if(!d)return '—';
  var s=fa(d.jd)+' '+MONTHS[d.jm-1]+' '+fa(d.jy);
  if(withWd) s=WD[jWeekday(d.jy,d.jm,d.jd)]+'، '+s;
  return s;
}
function fmtJShort(d){return d?fa(d.jy)+'/'+fa(pad2(d.jm))+'/'+fa(pad2(d.jd)):'—'}
function parseJ(str){
  if(!str)return null;
  var s=enDigits(String(str)).replace(/[\/\-\.]/g,'/').trim();
  var m=s.match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/);
  if(!m)return null;
  var jy=+m[1],jm=+m[2],jd=+m[3];
  if(jy<1000)jy+=1300;
  if(jm<1||jm>12||jd<1||jd>jMonthLen(jy,jm))return null;
  return {jy:jy,jm:jm,jd:jd};
}
function normalizeMobile(s){
  var x=enDigits(s).replace(/\D/g,'');
  if(x.indexOf('98')===0&&x.length===12)x='0'+x.slice(2);
  if(x.length===10&&x.charAt(0)==='9')x='0'+x;
  return x;
}
function parseTime(t){
  var s=enDigits(t||'').replace(/\D/g,'');
  if(s.length<3)return null;
  if(s.length===3)s='0'+s;
  var h=+s.slice(0,2),m=+s.slice(2,4);
  if(h>23||m>59)return null;
  return h*60+m;
}
function niceTime(t){var p=parseTime(t);if(p===null)return t||'—';return fa(pad2(~~(p/60))+':'+pad2(p%60))}
function daysFromToday(d){return dnum(d)-dnum(todayJ())}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='show';
  clearTimeout(t._t);t._t=setTimeout(function(){t.className=''},2400);
}

/* ==================== DATABASE ==================== */
var DB_KEY='atilie_calendar_db_v1';
var DB=null;
function blankDB(){
  return {
    version:1,
    customers:[],
    reservations:[],
    ceremonyTypes:['عروسی','حنابندان','عقد','نامزدی','تولد','سالگرد ازدواج','مراسم خانوادگی','سایر'],
    tasks:[],
    notes:[],
    settings:{studioName:'آتیله',reminderDays:3,autoBackup:true,lastBackup:null},
    createdAt:new Date().toISOString()
  };
}
function loadDB(){
  try{
    var raw=localStorage.getItem(DB_KEY);
    if(!raw){DB=blankDB();saveDB();return}
    var p=JSON.parse(raw);
    DB=Object.assign(blankDB(),p);
    if(!DB.settings)DB.settings=blankDB().settings;
    if(!DB.ceremonyTypes||!DB.ceremonyTypes.length)DB.ceremonyTypes=blankDB().ceremonyTypes;
  }catch(e){console.error(e);DB=blankDB()}
}
function saveDB(){
  try{localStorage.setItem(DB_KEY,JSON.stringify(DB))}
  catch(e){console.error(e);toast('خطا در ذخیره‌سازی!')}
}
function getRes(id){return DB.reservations.filter(function(r){return r.id===id})[0]||null}
function getCust(id){return DB.customers.filter(function(c){return c.id===id})[0]||null}
function fullName(c){return c?((c.firstName||'')+' '+(c.lastName||'')).trim()||'بدون نام':'—'}
function activeRes(){return DB.reservations.filter(function(r){return r.status!=='cancelled'})}
function paidOf(r){return (r.payments||[]).reduce(function(s,p){return s+(Number(p.amount)||0)},0)}
function remainingOf(r){return (Number(r.contractAmount)||0)-paidOf(r)}
function depositOf(r){var p=(r.payments||[])[0];return p?Number(p.amount)||0:0}
function finStatus(r){
  var c=Number(r.contractAmount)||0,p=paidOf(r);
  if(c<=0)return {label:'تعیین نشده',cls:'m'};
  if(p<=0)return {label:'پرداخت نشده',cls:'d'};
  if(p>=c)return {label:'تسویه کامل',cls:'g'};
  if(depositOf(r)>0&&p<=depositOf(r)&&p<c)return {label:'بیعانه پرداخت شده',cls:'w'};
  return {label:'پرداخت ناقص',cls:'w'};
}
function upsertCustomer(data){
  var mob=normalizeMobile(data.mobile);
  var found=null;
  if(data.id)found=getCust(data.id);
  if(!found&&mob){
    found=DB.customers.filter(function(c){return normalizeMobile(c.mobile)===mob})[0]||null;
  }
  if(found){
    found.firstName=data.firstName||found.firstName;
    found.lastName=data.lastName||found.lastName;
    found.mobile=data.mobile||found.mobile;
    found.bookerName=data.bookerName||found.bookerName;
    found.bookerMobile=data.bookerMobile||found.bookerMobile;
    found.phone2=data.phone2||found.phone2;
    found.notes=data.notes||found.notes;
    return found;
  }
  var c={
    id:uid(),
    firstName:data.firstName||'',lastName:data.lastName||'',
    mobile:data.mobile||'',bookerName:data.bookerName||'',
    bookerMobile:data.bookerMobile||'',phone2:data.phone2||'',
    notes:data.notes||'',createdAt:new Date().toISOString()
  };
  DB.customers.push(c);
  return c;
}
function eventsOn(d){
  var key=dkey(d),out=[];
  activeRes().forEach(function(r){
    var c=getCust(r.customerId);
    var nm=c?fullName(c):'';
    function push(kind,src,title){
      if(!src||!src.date)return;
      if(dkey(src.date)!==key)return;
      out.push({r:r,kind:kind,start:src.start||'',end:src.end||'',
        name:nm,title:title||KIND[kind].label,color:KIND[kind].color,
        place:src.place||''});
    }
    if(r.date)push('ceremony',{date:r.date,start:r.startTime,end:r.endTime},r.title||r.type);
    if(r.photo)push('photo',r.photo);
    if(r.video)push('video',r.video);
    if(r.formal)push('formal',r.formal);
    if(r.project&&r.project.finalDelivery){
      push('delivery',{date:r.project.finalDelivery,start:'',end:''},'تحویل پروژه');
    }
  });
  out.sort(function(a,b){
    var pa=parseTime(a.start),pb=parseTime(b.start);
    if(pa===null&&pb===null)return 0;
    if(pa===null)return 1;if(pb===null)return -1;
    return pa-pb;
  });
  return out;
}

/* ==================== STATE & ROUTER ==================== */
var TODAY=todayJ();
var state={
  view:'dashboard',
  calMode:'month',
  calY:TODAY.jy,calM:TODAY.jm,calD:TODAY.jd,
  selectedDay:dkey(TODAY),
  resId:null,
  custId:null,
  draft:null,
  calFilter:'all',
  search:'',
  repFrom:null,repTo:null
};
function go(view,opts){
  opts=opts||{};
  state.view=view;
  if(opts.id)state.resId=opts.id;
  if(opts.custId)state.custId=opts.custId;
  window.scrollTo(0,0);
  render();
}

/* ==================== SHELL RENDER ==================== */
var NAV=[
  {v:'dashboard',l:'داشبورد',i:'🏠'},
  {v:'calendar',l:'تقویم',i:'📅'},
  {v:'newres',l:'ثبت رزرو جدید',i:'➕'},
  {v:'customers',l:'مشتریان',i:'👥'},

  var videoUp=list.filter(function(r){return r.video&&r.video.date&&dnum(r.video.date)>=dnum(TODAY)});
  var formalUp=list.filter(function(r){return r.formal&&r.formal.date&&dnum(r.formal.date)>=dnum(TODAY)});

    statCard('b','فیلم‌برداری پیش رو',fa(videoUp.length))+
    statCard('t','فرمالیته پیش رو',fa(formalUp.length))+

function filteredEvents(d){

function monthView(){
  var cells=buildMonth(state.calY,state.calM);
  var h=calNavHTML();
  h+='<div class="card" style="padding:10px"><div class="cal-grid">';
  WDS.forEach(function(w,i){

  });
  cells.forEach(function(c){
    var isToday=(c.jy===TODAY.jy&&c.jm===TODAY.jm&&c.jd===TODAY.jd);
    var isSel=(dkey(c)===state.selectedDay);
    var ev=filteredEvents(c);
    h+='<div class="cal-cell'+(c.out?' out':'')+(isToday?' today':'')+(isSel?' sel':'')+'" data-act="pickDay" data-key="'+dkey(c)+'">'+
      '<div class="dnum"><span>'+fa(c.jd)+'</span>'+(ev.length?'<span style="font-size:9px;opacity:.6">'+fa(ev.length)+'</span>':'')+'</div>';
    ev.slice(0,2).forEach(function(e){
      h+='<div class="ev" style="background:'+e.color+'22;color:'+e.color+'">'+esc(e.name||e.title)+'</div>';
    });
    if(ev.length>2)h+='<div class="ev-more">+' + fa(ev.length-2) + ' مورد</div>';
    h+='</div>';
  });
  h+='</div></div>';
  var p=state.selectedDay.split('-');
  var sel={jy:+p[0],jm:+p[1],jd:+p[2]};
  var ev=filteredEvents(sel);
  h+='<div class="card"><div class="card-h"><h3>'+fmtJ(sel,true)+'</h3>'+
    '<button class="link" data-act="newOnDay" data-key="'+dkey(sel)+'">➕ افزودن</button></div>';
  if(!ev.length)h+='<div class="empty"><div class="em">🗓️</div><p>برنامه‌ای برای این روز نیست</p></div>';
  else ev.forEach(function(e){h+=evRow(e)});
  h+='</div>';
  return h;
}
function buildMonth(jy,jm){
  var len=jMonthLen(jy,jm);
  var firstWd=jWeekday(jy,jm,1);
  var cells=[];
  var pm=jm===1?12:jm-1,py=jm===1?jy-1:jy;
  var plen=jMonthLen(py,pm);
  for(var i=firstWd-1;i>=0;i--)cells.push({jy:py,jm:pm,jd:plen-i,out:true});
  for(var d=1;d<=len;d++)cells.push({jy:jy,jm:jm,jd:d,out:false});
  var nm=jm===12?1:jm+1,ny=jm===12?jy+1:jy;
  var k=1;
  while(cells.length%7!==0){cells.push({jy:ny,jm:nm,jd:k++,out:true})}
  return cells;
}
function weekView(){
  var p=state.selectedDay.split('-');
  var sel={jy:+p[0],jm:+p[1],jd:+p[2]};
  var wd=jWeekday(sel.jy,sel.jm,sel.jd);
  var base=j2d(sel.jy,sel.jm,sel.jd)-wd;
  var h='<div class="cal-head"><div class="cal-nav">'+
    '<button data-act="calPrev">‹</button>'+
    '<button data-act="calToday" style="width:auto;padding:0 12px;font-size:12px;font-weight:600">این هفته</button>'+
    '<button data-act="calNext">›</button></div>'+
    '<div class="cal-title">هفته '+fmtJ(sel)+'</div></div>';
  h+='<div class="week-grid">';
  for(var i=0;i<7;i++){
    var jj=d2j(base+i);
    var isToday=(jj.jy===TODAY.jy&&jj.jm===TODAY.jm&&jj.jd===TODAY.jd);
    var ev=filteredEvents(jj);
    h+='<div class="day-col'+(isToday?' today':'')+'"><h4>'+WD[i]+'<b>'+fa(jj.jd)+'</b></h4>';
    if(!ev.length)h+='<div style="font-size:10px;color:#B9BECF;text-align:center;padding:6px">—</div>';
    ev.forEach(function(e){
      h+='<div class="day-ev" data-act="openRes" data-id="'+e.r.id+'" style="background:'+e.color+'20;border-color:'+e.color+';color:'+e.color+'">'+
        niceTime(e.start)+'<br>'+esc(e.name||e.title)+'</div>';
    });
    h+='</div>';
  }
  return h+'</div>';
}
function dayView(){
  var p=state.selectedDay.split('-');
  var sel={jy:+p[0],jm:+p[1],jd:+p[2]};
  var ev=filteredEvents(sel);
  var h='<div class="cal-head"><div class="cal-nav">'+
    '<button data-act="calPrev">‹</button>'+
    '<button data-act="calToday" style="width:auto;padding:0 12px;font-size:12px;font-weight:600">امروز</button>'+
    '<button data-act="calNext">›</button></div>'+
    '<div class="cal-title">'+fmtJ(sel,true)+'</div></div>';
  h+='<div class="card"><div class="card-h"><h3>برنامه‌های روز</h3>'+
    '<button class="link" data-act="newOnDay" data-key="'+dkey(sel)+'">➕ افزودن</button></div>';
  if(!ev.length)h+='<div class="empty"><div class="em">🗓️</div><p>برنامه‌ای ثبت نشده</p></div>';
  else ev.forEach(function(e){h+=evRow(e)});
  return h+'</div>';
  }

  if(!d.hall)d.hall={name:'',address:'',phone:''};
  if(!d.staff)d.staff={photographer:'',videographer:'',teamSize:'',equipment:''};

  return d;

function checkConflict(d){
  var conflicts=[];
  function tOverlap(a1,a2,b1,b2){
    var x=parseTime(a1),y=parseTime(a2),z=parseTime(b1),w=parseTime(b2);
    if(x===null||z===null)return false;
    if(y===null)y=x+120; if(w===null)w=z+120;
    return x<w&&z<y;
  }
  var mine=[];
  if(d.date)mine.push({k:'ceremony',d:d.date,s:d.startTime,e:d.endTime,l:'مراسم'});
  if(d.photo.date)mine.push({k:'photo',d:d.photo.date,s:d.photo.start,e:d.photo.end,l:'عکاسی'});
  if(d.video.date)mine.push({k:'video',d:d.video.date,s:d.video.start,e:d.video.end,l:'فیلم‌برداری'});
  if(d.formal.date)mine.push({k:'formal',d:d.formal.date,s:d.formal.start,e:d.formal.end,l:'فرمالیته'});
  mine.forEach(function(m){
    activeRes().forEach(function(r){
      if(r.id===d.id)return;
      var others=[];
      if(r.date)others.push({d:r.date,s:r.startTime,e:r.endTime,l:'مراسم'});
      if(r.photo&&r.photo.date)others.push({d:r.photo.date,s:r.photo.start,e:r.photo.end,l:'عکاسی'});
      if(r.video&&r.video.date)others.push({d:r.video.date,s:r.video.start,e:r.video.end,l:'فیلم‌برداری'});
      if(r.formal&&r.formal.date)others.push({d:r.formal.date,s:r.formal.start,e:r.formal.end,l:'فرمالیته'});
      others.forEach(function(o){
        if(dkey(o.d)===dkey(m.d)&&tOverlap(m.s,m.e,o.s,o.e)){
          var c=getCust(r.customerId);
          conflicts.push(m.l+' با '+o.l+' «'+(c?fullName(c):'')+'» تداخل دارد ('+fmtJShort(m.d)+')');
        }
      });
    });
  });
  return conflicts;
}
function saveReservation(){
  var d=collectForm();
  if(!d.cust.firstName||!d.cust.lastName){toast('نام و نام خانوادگی مشتری الزامی است');return}
  if(!d.cust.mobile||normalizeMobile(d.cust.mobile).length<10){toast('شماره موبایل معتبر وارد کنید');return}
  if(!d.date){toast('تاریخ مراسم را صحیح وارد کنید (مثال: ۱۴۰۳/۰۵/۱۲)');return}
  var conf=checkConflict(d);
  if(conf.length){
    if(!confirm('⚠️ هشدار تداخل:\n\n'+conf.slice(0,4).join('\n')+'\n\nبا این وجود ذخیره شود؟'))return;
  }
  var cust=upsertCustomer({
    id:d.customerId,
    firstName:d.cust.firstName,lastName:d.cust.lastName,
    mobile:d.cust.mobile,bookerName:d.cust.bookerName,
    bookerMobile:d.cust.bookerMobile,phone2:d.cust.phone2,notes:d.cust.notes
  });
  var existing=d.id?getRes(d.id):null;
  var rec={
    id:d.id||uid(),
    customerId:cust.id,
    title:d.title,type:d.type,date:d.date,
    startTime:d.startTime,endTime:d.endTime,
    hall:d.hall,couple:d.couple,notes:d.notes,
    photo:d.photo,video:d.video,formal:d.formal,
    contractAmount:d.contractAmount,
    payments:d.payments,
    project:d.project,
    staff:d.staff,
    status:'active',
    createdAt:existing?existing.createdAt:new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };
  if(existing){
    var idx=DB.reservations.indexOf(existing);
    DB.reservations[idx]=rec;
  } else {
    DB.reservations.push(rec);
  }
  saveDB();
  state.draft=null;
  toast(existing?'تغییرات ذخیره شد ✅':'رزرو با موفقیت ثبت شد ✅');
  go('resdetail',{id:rec.id});
}

/* ==================== REPORTS ==================== */
function vReports(){
  var from=state.repFrom||{jy:TODAY.jy,jm:TODAY.jm,jd:1};
  var to=state.repTo||{jy:TODAY.jy,jm:TODAY.jm,jd:jMonthLen(TODAY.jy,TODAY.jm)};
  var list=activeRes().filter(function(r){
    if(!r.date)return false;
    return dnum(r.date)>=dnum(from)&&dnum(r.date)<=dnum(to);
  });
  var done=list.filter(function(r){return (r.project.stage||0)>=2});
  var cancelled=DB.reservations.filter(function(r){return r.status==='cancelled'});
  var revenue=list.reduce(function(s,r){return s+(r.contractAmount||0)},0);
  var paid=list.reduce(function(s,r){return s+paidOf(r)},0);
  var deposit=list.reduce(function(s,r){return s+depositOf(r)},0);
  var due=revenue-paid;
  var unsettled=list.filter(function(r){return remainingOf(r)>0});
  var notDelivered=list.filter(function(r){return (r.project.stage||0)<7});
  var late=list.filter(function(r){return r.project.finalDelivery&&(r.project.stage||0)<7&&dnum(r.project.finalDelivery)<dnum(TODAY)});

  var h='<div class="card"><div class="section-title">📅 بازه زمانی</div>'+
    '<div class="frow">'+dateField('از تاریخ','repFrom',from)+dateField('تا تاریخ','repTo',to)+'</div>'+
    '<button class="btn btn-primary btn-sm" data-act="applyReport">اعمال فیلتر</button>'+
  '</div>';
  h+='<div class="stats">'+
    statCard('p','رزروهای بازه',fa(list.length))+
    statCard('g','مراسم انجام‌شده',fa(done.length))+
    statCard('d','رزرو لغوشده',fa(cancelled.length))+
    statCard('b','درآمد قراردادها',money(revenue),'تومان')+
    statCard('t','بیعانه دریافتی',money(deposit),'تومان')+
    statCard('g','کل دریافتی',money(paid),'تومان')+
    statCard('d','مطالبات',money(due),'تومان')+
    statCard('w','تسویه‌نشده',fa(unsettled.length))+
    statCard('w','تحویل‌نشده',fa(notDelivered.length))+
    statCard('d','عقب‌افتاده',fa(late.length))+
  '</div>';
  h+='<div class="card"><div class="card-h"><h3>خروجی</h3></div>'+
    '<div class="row">'+
    '<button class="btn btn-sm" data-act="exportExcel">📊 خروجی Excel (CSV)</button>'+
    '<button class="btn btn-sm" data-act="exportPDF">📄 خروجی چاپ (PDF)</button>'+
    '</div></div>';
  return h;
}

/* ==================== REMINDERS ==================== */
function vReminders(){
  var list=activeRes();
  var items=[];
  var todayN=dnum(TODAY);
  list.forEach(function(r){
    var c=getCust(r.customerId);
    if(!c)return;
    var name=fullName(c);
    if(r.date){
      var dd=dnum(r.date)-todayN;
      if(dd===1)items.push({icon:'🔔',title:'مراسم فردا',desc:name+' — '+esc(r.title||r.type),cls:'w',rid:r.id});
      else if(dd===0)items.push({icon:'📌',title:'مراسم امروز',desc:name+' — '+esc(r.title||r.type),cls:'d',rid:r.id});
    }
    ['photo','video','formal'].forEach(function(k){
      var s=r[k];
      if(!s||!s.date)return;
      var d2=dnum(s.date)-todayN;
      var lbl=k==='photo'?'عکاسی':k==='video'?'فیلم‌برداری':'فرمالیته';
      if(d2===1)items.push({icon:'⏰',title:lbl+' فردا',desc:name,cls:'w',rid:r.id});
      else if(d2===0)items.push({icon:'⏰',title:lbl+' امروز',desc:name,cls:'d',rid:r.id});
    });
    if(remainingOf(r)>0&&dnum(r.date)<todayN)items.push({icon:'💰',title:'مطالبات باقی‌مانده',desc:name+' — '+money(remainingOf(r))+' تومان',cls:'d',rid:r.id});
    if(r.project.finalDelivery){
      var d3=dnum(r.project.finalDelivery)-todayN;
      if(d3<0&&(r.project.stage||0)<7)items.push({icon:'⚠️',title:'تحویل عقب‌افتاده',desc:name+' — '+fa(-d3)+' روز',cls:'d',rid:r.id});
      else if(d3>=0&&d3<=3)items.push({icon:'📦',title:'تحویل نزدیک',desc:name+' — '+fa(d3)+' روز',cls:'w',rid:r.id});
    }
  });
  if(!items.length)return '<div class="empty"><div class="em">✅</div><p>هیچ یادآوری فعالی نیست. همه‌چیز مرتب است!</p></div>';
  var h='';
  items.forEach(function(it){
    h+='<div class="item" data-act="openRes" data-id="'+it.rid+'">'+
      '<div class="av" style="background:var(--bg)">'+it.icon+'</div>'+
      '<div class="info"><b>'+esc(it.title)+'</b><span>'+it.desc+'</span></div>'+
      '<div class="side"><span class="tag '+it.cls+'">مهم</span></div></div>';
  });
  return h;
}

/* ==================== EVENT HANDLERS ==================== */
document.addEventListener('click',function(e){
  var t=e.target;
  var el=t.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act');
  var id=el.getAttribute('data-id');
  var key=el.getAttribute('data-key');
  var i=el.getAttribute('data-i');
  var f=el.getAttribute('data-f');
  var mode=el.getAttribute('data-mode');

  if(act==='go'){e.preventDefault();go(el.getAttribute('data-view'));return}
  if(act==='openRes'){e.preventDefault();go('resdetail',{id:id});return}
  if(act==='openCust'){e.preventDefault();go('custdetail',{custId:id});return}
  if(act==='editRes'){e.preventDefault();state.draft=null;go('editres',{id:id});return}
  if(act==='newForCust'){e.preventDefault();state.draft=newDraft();state.draft.customerId=id;go('newres');return}
  if(act==='calMode'){state.calMode=mode;render();return}
  if(act==='calFilter'){state.calFilter=f;render();return}
  if(act==='calPrev'){
    if(state.calMode==='month'){state.calM--;if(state.calM<1){state.calM=12;state.calY--}}
    else if(state.calMode==='week'){var p=state.selectedDay.split('-');var jj=d2j(j2d(+p[0],+p[1],+p[2])-7);state.selectedDay=dkey(jj);state.calY=jj.jy;state.calM=jj.jm}
    else if(state.calMode==='day'){var p2=state.selectedDay.split('-');var jj2=d2j(j2d(+p2[0],+p2[1],+p2[2])-1);state.selectedDay=dkey(jj2);state.calY=jj2.jy;state.calM=jj2.jm}
    render();return;
  }
  if(act==='calNext'){
    if(state.calMode==='month'){state.calM++;if(state.calM>12){state.calM=1;state.calY++}}
    else if(state.calMode==='week'){var p=state.selectedDay.split('-');var jj=d2j(j2d(+p[0],+p[1],+p[2])+7);state.selectedDay=dkey(jj);state.calY=jj.jy;state.calM=jj.jm}
    else if(state.calMode==='day'){var p2=state.selectedDay.split('-');var jj2=d2j(j2d(+p2[0],+p2[1],+p2[2])+1);state.selectedDay=dkey(jj2);state.calY=jj2.jy;state.calM=jj2.jm}
    render();return;
  }
  if(act==='calToday'){state.calY=TODAY.jy;state.calM=TODAY.jm;state.selectedDay=dkey(TODAY);render();return}
  if(act==='pickDay'){state.selectedDay=key;var p=key.split('-');state.calY=+p[0];state.calM=+p[1];render();return}
  if(act==='newOnDay'){
    state.draft=newDraft();
    var p=key.split('-');state.draft.date={jy:+p[0],jm:+p[1],jd:+p[2]};
    go('newres');return;
  }
  if(act==='cancelForm'){state.draft=null;go('dashboard');return}
  if(act==='addPaymentDraft'){
    var amt=prompt('مبلغ پرداخت (تومان):');
    if(!amt)return;
    var dt=prompt('تاریخ پرداخت (مثال ۱۴۰۳/۰۵/۱۲):',fmtJShort(TODAY));
    var d=parseJ(dt);if(!d){toast('تاریخ نامعتبر');return}
    var method=prompt('روش پرداخت:\n'+PAY_METHODS.map(function(m,i){return (i+1)+') '+m}).join('\n'),'1');
    var mi=(Number(enDigits(method||'1'))||1)-1;
    state.draft.payments.push({amount:Number(enDigits(amt).replace(/\D/g,''))||0,date:d,method:PAY_METHODS[Math.max(0,Math.min(PAY_METHODS.length-1,mi))],note:''});
    render();return;
  }
  if(act==='delDraftPayment'){
    state.draft.payments.splice(+i,1);render();return;
  }
  if(act==='addPayment'){
    var r=getRes(id);if(!r)return;
    var amt=prompt('مبلغ پرداخت (تومان):');if(!amt)return;
    var dt=prompt('تاریخ پرداخت:',fmtJShort(TODAY));var dd=parseJ(dt);if(!dd){toast('تاریخ نامعتبر');return}
    var method=prompt('روش پرداخت (1=کارت،2=نقدی،3=انتقال،4=سایر):','1');
    var mi=(Number(enDigits(method||'1'))||1)-1;
    var note=prompt('توضیح (اختیاری):','')||'';
    r.payments=r.payments||[];
    r.payments.push({amount:Number(enDigits(amt).replace(/\D/g,''))||0,date:dd,method:PAY_METHODS[Math.max(0,Math.min(PAY_METHODS.length-1,mi))],note:note});
    saveDB();toast('پرداخت ثبت شد ✅');render();return;
  }
  if(act==='delPayment'){
    if(!confirm('این پرداخت حذف شود؟'))return;
    var r=getRes(id);r.payments.splice(+i,1);saveDB();render();return;
  }
  if(act==='delOutput'){
    if(!confirm('این خروجی حذف شود؟'))return;
    var r=getRes(id);r.project.outputs.splice(+i,1);saveDB();render();return;
  }
  if(act==='addOutput'){
    var r=getRes(id);if(!r)return;
    var type=prompt('نوع خروجی (فیلم/عکس/آلبوم/کلیپ/سایر):','فیلم');
    if(!type)return;
    var status=prompt('وضعیت (در انتظار/در حال انجام/آماده/تحویل شده):','در انتظار');
    r.project.outputs=r.project.outputs||[];
    r.project.outputs.push({type:type,status:status||'در انتظار'});
    saveDB();render();return;
  }
  if(act==='delRes'){
    if(!confirm('این رزرو حذف شود؟'))return;
    var r=getRes(id);
    var idx=DB.reservations.indexOf(r);
    DB.reservations.splice(idx,1);saveDB();toast('حذف شد');go('dashboard');return;
  }
  if(act==='delCust'){
    if(!confirm('مشتری و تمام رزروهایش حذف شود؟'))return;
    DB.customers=DB.customers.filter(function(c){return c.id!==id});
    DB.reservations=DB.reservations.filter(function(r){return r.customerId!==id});
    saveDB();toast('حذف شد');go('customers');return;
  }
  if(act==='copy'){
    var val=el.getAttribute('data-val');
    if(navigator.clipboard){navigator.clipboard.writeText(val).then(function(){toast('کپی شد ✅')})}
    else{var tmp=document.createElement('textarea');tmp.value=val;document.body.appendChild(tmp);tmp.select();document.execCommand('copy');document.body.removeChild(tmp);toast('کپی شد ✅')}
    return;
  }
  if(act==='setStage'){
    /* handled in change event */
  }
  if(act==='saveSettings'){
    DB.settings.studioName=document.getElementById('setStudio').value.trim();
    DB.settings.reminderDays=Number(enDigits(document.getElementById('setReminder').value))||3;
    saveDB();toast('ذخیره شد ✅');render();return;
  }
  if(act==='addCerType'){
    var nt=document.getElementById('newCerType').value.trim();
    if(!nt)return;
    DB.ceremonyTypes.push(nt);saveDB();toast('اضافه شد ✅');render();return;
  }
  if(act==='delCerType'){
    if(!confirm('حذف شود؟'))return;
    DB.ceremonyTypes.splice(+i,1);saveDB();render();return;
  }
  if(act==='exportBackup'){
    var data=JSON.stringify(DB,null,2);
    var blob=new Blob([data],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;
    a.download='atilie-backup-'+dkey(TODAY)+'.json';a.click();
    URL.revokeObjectURL(url);
    DB.settings.lastBackup=fmtJ(TODAY)+' '+new Date().toLocaleTimeString('fa-IR');
    saveDB();toast('پشتیبان دانلود شد ✅');return;
  }
  if(act==='applyReport'){
    var fromInp=document.querySelector('[data-dfield="repFrom"]');
    var toInp=document.querySelector('[data-dfield="repTo"]');
    state.repFrom=parseJ(fromInp?fromInp.value:'');
    state.repTo=parseJ(toInp?toInp.value:'');
    if(!state.repFrom||!state.repTo){toast('تاریخ نامعتبر');return}
    render();return;
  }
  if(act==='exportExcel'){
    var rows=[['نام','موبایل','نوع','تاریخ','مبلغ','پرداخت','مانده','مرحله']];
    activeRes().forEach(function(r){
      var c=getCust(r.customerId);
      rows.push([c?fullName(c):'',c?c.mobile:'',r.type||'',fmtJShort(r.date),r.contractAmount||0,paidOf(r),remainingOf(r),STAGES[r.project.stage||0]]);
    });
    var csv='\uFEFF'+rows.map(function(row){return row.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='atilie-report-'+dkey(TODAY)+'.csv';a.click();
    URL.revokeObjectURL(url);toast('فایل CSV دانلود شد ✅');return;
  }
  if(act==='exportPDF'){
    window.print();return;
  }
  if(act==='printRes'){
    var r=getRes(id);if(!r)return;
    var c=getCust(r.customerId);
    var win=window.open('','_blank');
    win.document.write('<html dir="rtl"><head><title>برگه رزرو</title><style>body{font-family:Tahoma,sans-serif;padding:30px;line-height:2}h1{color:#4D52B4;border-bottom:2px solid #4D52B4;padding-bottom:10px}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #ddd}td:first-child{color:#666;width:150px}</style></head><body>'+
      '<h1>تقویم آتیله — برگه رزرو</h1>'+
      '<table>'+
      '<tr><td>مشتری</td><td>'+(c?fullName(c):'')+'</td></tr>'+
      '<tr><td>موبایل</td><td>'+(c?c.mobile:'')+'</td></tr>'+
      '<tr><td>نام مراسم</td><td>'+esc(r.title||r.type)+'</td></tr>'+
      '<tr><td>تاریخ</td><td>'+fmtJ(r.date,true)+'</td></tr>'+
      '<tr><td>ساعت</td><td>'+niceTime(r.startTime)+'</td></tr>'+
      '<tr><td>تالار</td><td>'+esc(r.hall.name||'')+'</td></tr>'+
      '<tr><td>مبلغ قرارداد</td><td>'+money(r.contractAmount)+' تومان</td></tr>'+
      '<tr><td>مانده</td><td>'+money(remainingOf(r))+' تومان</td></tr>'+
      '</table></body></html>');
    win.document.close();win.print();return;
  }
  if(act==='printReceipt'){
    var r=getRes(id);if(!r)return;
    var c=getCust(r.customerId);
    var win=window.open('','_blank');
    win.document.write('<html dir="rtl"><head><title>رسید بیعانه</title><style>body{font-family:Tahoma,sans-serif;padding:30px;line-height:2}h1{color:#4D52B4;text-align:center;border-bottom:2px solid #4D52B4;padding-bottom:10px}table{width:100%;border-collapse:collapse;margin-top:20px}td{padding:10px;border-bottom:1px solid #ddd}td:first-child{color:#666;width:150px}.sign{margin-top:60px;display:flex;justify-content:space-between}</style></head><body>'+
      '<h1>رسید دریافت بیعانه</h1>'+
      '<table>'+
      '<tr><td>مشتری</td><td>'+(c?fullName(c):'')+'</td></tr>'+
      '<tr><td>موبایل</td><td>'+(c?c.mobile:'')+'</td></tr>'+
      '<tr><td>مبلغ بیعانه</td><td>'+money(depositOf(r))+' تومان</td></tr>'+
      '<tr><td>مبلغ کل</td><td>'+money(r.contractAmount)+' تومان</td></tr>'+
      '<tr><td>مانده</td><td>'+money(remainingOf(r))+' تومان</td></tr>'+
      '<tr><td>تاریخ</td><td>'+fmtJ(TODAY)+'</td></tr>'+
      '</table>'+
      '<div class="sign"><div>مهر و امضای آتلیه</div><div>امضای مشتری</div></div>'+
      '</body></html>');
    win.document.close();win.print();return;
  }
  if(act==='resetAll'){
    if(!confirm('⚠️ تمام اطلاعات پاک می‌شود. مطمئنید؟'))return;
    if(!confirm('آخرین تأیید: واقعاً حذف شود؟'))return;
    localStorage.removeItem(DB_KEY);DB=blankDB();saveDB();toast('همه داده‌ها پاک شد');go('dashboard');return;
  }
  if(act==='pickDate'){
    var inp=document.getElementById(el.getAttribute('data-input'));
    if(!inp)return;
    var cur=parseJ(inp.value)||TODAY;
    var jy=prompt('سال:',cur.jy);if(!jy)return;
    var jm=prompt('ماه (۱-۱۲):',cur.jm);if(!jm)return;
    var jd=prompt('روز:',cur.jd);if(!jd)return;
    var d={jy:+enDigits(jy),jm:+enDigits(jm),jd:+enDigits(jd)};
    if(d.jm<1||d.jm>12||d.jd<1||d.jd>jMonthLen(d.jy,d.jm)){toast('تاریخ نامعتبر');return}
    inp.value=fmtJShort(d);return;
  }
});

document.addEventListener('change',function(e){
  var el=e.target;
  var act=el.getAttribute('data-act');
  if(act==='setStage'){
    var r=getRes(el.getAttribute('data-id'));
    if(r){r.project.stage=Number(el.value)||0;saveDB();toast('مرحله پروژه به‌روز شد ✅')}
  }
  if(act==='importBackup'){
    var file=el.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var data=JSON.parse(reader.result);
        if(!data.customers||!data.reservations)throw new Error('فایل نامعتبر');
        if(!confirm('اطلاعات فعلی جایگزین شود؟'))return;
        DB=Object.assign(blankDB(),data);
        saveDB();toast('بازیابی انجام شد ✅');render();
      }catch(err){toast('فایل پشتیبان نامعتبر')}
    };
    reader.readAsText(file);
  }
});

document.addEventListener('submit',function(e){
  if(e.target.id==='resForm'){
    e.preventDefault();saveReservation();
  }
});

document.addEventListener('input',function(e){
  var el=e.target;
  var act=el.getAttribute('data-act');
  if(act==='searchCust'||act==='searchCer'){
    state.search=el.value;
    var q=state.search;
    /* re-render list only */
    var content=document.querySelector('.content');
    if(content){
      var html=state.view==='customers'?vCustomers():vCeremonies();
      var box=content.querySelector('.search-box');
      if(box){
        var tmp=document.createElement('div');tmp.innerHTML=html;
        content.replaceChild(tmp.querySelector('.search-box'),box);
        var nodes=content.querySelectorAll('.item, .empty');
        nodes.forEach(function(n){n.remove()});
        var newNodes=tmp.querySelectorAll('.item, .empty');
        newNodes.forEach(function(n){content.appendChild(n)});
      }
    }
  }
});

/* ==================== INIT ==================== */
loadDB();
render();
  
/* ثبت Service Worker */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
